<style>

*{box-sizing:border-box}

.it{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%) rotate(var(--r)) scale(.2);opacity:0;transition:transform .9s cubic-bezier(.3,1.6,.5,1) calc(var(--i)*.09s + .25s),opacity .4s ease calc(var(--i)*.09s + .25s)}

.sw{width:100%;height:100%;position:relative;animation:sway 5s ease-in-out calc(var(--i)*-.7s) infinite alternate;transform-origin:50% 90%}

.paper.it .sw,.tape .sw,.nosw .sw{animation:none}
.fl{position:relative;width:100%;height:100%}
.pt{position:absolute;top:0;left:var(--l);width:var(--w);height:50%;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(40,30,20,.12);transform-origin:50% 100%;transform:rotate(var(--a)) scale(0);transition:transform .8s cubic-bezier(.3,1.5,.5,1) calc(var(--i)*.09s + .7s)}

.ct{position:absolute;left:34%;top:34%;width:32%;height:32%;border-radius:50%;background:var(--cc);box-shadow:inset 0 0 0 .15cqw rgba(40,30,20,.2)}
.leaf{width:100%;height:100%;background:var(--c);border-radius:0 100% 0 100%}

.on .stem{transform:scaleY(1)}
.tape{background:rgba(222,190,120,.75);aspect-ratio:3/1;box-shadow:0 .1cqw .3cqw rgba(0,0,0,.15)}

.frame{position:absolute;left:3%;top:7%;width:26%;height:86%;border-radius:2.4cqw;border:.5cqw solid #fff;background:var(--fb);overflow:hidden;box-shadow:0 .5cqw 1.5cqw rgba(0,0,0,.12);container-type:size}
.main{position:absolute;left:33%;right:4%;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center}

.card li{margin:.2cqw 0}
.card li::marker{font-weight:700}
.tp{position:absolute;width:6cqw;height:2.2cqw;background:rgba(222,190,120,.8);z-index:3}
.foot{position:absolute;right:3cqw;bottom:2cqw;font-size:1cqw;color:#6c6258}
